name: Gerar APK Android

on:
workflow_dispatch:
push:
branches:
- principal

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Baixar arquivos
    uses: actions/checkout@v4

  - name: Preparar Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Instalar Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Extrair projeto
    run: |
      mkdir extracted
      unzip -q 8BallPoolAimAssistant_v03_cloud_build.zip -d extracted
      PROJECT_DIR=$(find extracted -name settings.gradle -printf '%h\n' | head -n 1)
      echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

  - name: Compilar APK
    run: gradle -p "$PROJECT_DIR" assembleDebug

  - name: Disponibilizar APK
    uses: actions/upload-artifact@v4
    with:
      name: 8BallPool-AimAssistant-APK
      path: extracted/**/app/build/outputs/apk/debug/*.apk
